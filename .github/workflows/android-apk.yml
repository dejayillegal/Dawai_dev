name: Build Android Debug APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android-debug-apk:
    name: Build & Upload Debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install npm dependencies
        run: npm ci

      - name: Verify web core & build production bundle
        run: npm run check

      - name: Build Android Debug APK
        run: |
          rm -f android/local.properties
          npm run android:build

      - name: Verify APK & generate SHA-256 checksum
        run: |
          APK_PATH="android/app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -s "$APK_PATH" ]; then
            echo "Error: Expected debug APK not found or empty at $APK_PATH"
            exit 1
          fi
          cp "$APK_PATH" android/app/build/outputs/apk/debug/aidaw-debug.apk
          sha256sum "$APK_PATH" | tee android/app/build/outputs/apk/debug/app-debug.apk.sha256
          APK_SIZE=$(stat -c%s "$APK_PATH")
          APK_SHA=$(awk '{print $1}' android/app/build/outputs/apk/debug/app-debug.apk.sha256)
          {
            echo "### Android Debug APK Build Summary"
            echo ""
            echo "| Property | Value |"
            echo "| :--- | :--- |"
            echo "| **Artifact Name** | \`aidaw-debug-apk\` |"
            echo "| **APK File** | \`app-debug.apk\` / \`aidaw-debug.apk\` |"
            echo "| **Size (bytes)** | \`$APK_SIZE\` |"
            echo "| **SHA-256** | \`$APK_SHA\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: aidaw-debug-apk
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/debug/aidaw-debug.apk
            android/app/build/outputs/apk/debug/app-debug.apk.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Attach Debug APK to GitHub Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/debug/aidaw-debug.apk
            android/app/build/outputs/apk/debug/app-debug.apk.sha256
          generate_release_notes: true
