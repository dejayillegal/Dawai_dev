name: Inspect archived source (manual)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compare archived source without overwriting the checkout
        shell: python
        run: |
          from pathlib import Path, PurePosixPath
          import zipfile
          with zipfile.ZipFile('refine-daw-architectural-plan.zip') as archive:
              entries = archive.infolist()
              if len(entries) > 5000 or sum(x.file_size for x in entries) > 64 * 1024 * 1024:
                  raise ValueError('Archive exceeds inspection limits')
              for entry in entries:
                  path = PurePosixPath(entry.filename)
                  if path.is_absolute() or '..' in path.parts or '\\' in entry.filename:
                      raise ValueError('Unsafe archive path')
                  if entry.is_dir():
                      continue
                  target = Path(entry.filename)
                  same = target.is_file() and target.read_bytes() == archive.read(entry)
                  print(repr(entry.filename), 'matches' if same else 'differs')
