name: Verify DAW core
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  web-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
