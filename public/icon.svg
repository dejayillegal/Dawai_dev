<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Deep Matte Obsidian Background -->
    <radialGradient id="obsidianBg" cx="50%" cy="45%" r="70%">
      <stop offset="0%" stop-color="#141820"/>
      <stop offset="60%" stop-color="#0b0e13"/>
      <stop offset="100%" stop-color="#06080b"/>
    </radialGradient>

    <!-- Brushed Dark Titanium Left Facet (Warm Amber Rim) -->
    <linearGradient id="leftFacet" x1="0%" y1="100%" x2="80%" y2="0%">
      <stop offset="0%" stop-color="#78350f"/>
      <stop offset="35%" stop-color="#27201c"/>
      <stop offset="75%" stop-color="#1e242d"/>
      <stop offset="100%" stop-color="#333d4b"/>
    </linearGradient>

    <!-- Brushed Dark Titanium Right Facet (Cyber Cyan Rim) -->
    <linearGradient id="rightFacet" x1="20%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#333d4b"/>
      <stop offset="45%" stop-color="#18222c"/>
      <stop offset="80%" stop-color="#0e3a47"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </linearGradient>

    <!-- Inner Bevel Shadow Facet -->
    <linearGradient id="innerDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f1319"/>
      <stop offset="100%" stop-color="#07090d"/>
    </linearGradient>

    <!-- Horizontal Acoustic Pulse Rim Gradient -->
    <linearGradient id="pulseRim" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.9"/>
      <stop offset="48%" stop-color="#94a3b8" stop-opacity="0.95"/>
      <stop offset="55%" stop-color="#22d3ee" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.9"/>
    </linearGradient>

    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#000000" flood-opacity="0.85"/>
    </filter>
  </defs>

  <!-- Minimalist Matte Obsidian Icon Canvas -->
  <rect width="512" height="512" rx="108" fill="url(#obsidianBg)"/>
  <rect x="10" y="10" width="492" height="492" rx="100" fill="none" stroke="#1e2530" stroke-width="2"/>

  <!-- Precision Faceted Geometric "A" Monogram -->
  <g filter="url(#dropShadow)">
    <!-- Top Crown Facet -->
    <polygon points="232,126 280,126 256,184" fill="#3b4454" stroke="#f59e0b" stroke-width="1" stroke-opacity="0.55"/>
    <polygon points="256,184 280,126 268,214" fill="#13333e"/>

    <!-- Upper Left Pillar -->
    <polygon points="232,126 172,248 206,248 244,158" fill="url(#leftFacet)" stroke="#f59e0b" stroke-width="1.2" stroke-opacity="0.65"/>
    <polygon points="244,158 206,248 228,248 256,184" fill="url(#innerDark)"/>

    <!-- Upper Right Pillar -->
    <polygon points="280,126 268,158 306,248 340,248" fill="url(#rightFacet)" stroke="#06b6d4" stroke-width="1.2" stroke-opacity="0.6"/>
    <polygon points="256,184 284,248 306,248 268,158" fill="#141c24"/>

    <!-- Lower Left Leg -->
    <polygon points="162,268 104,384 152,384 196,268" fill="url(#leftFacet)" stroke="#f59e0b" stroke-width="1.4" stroke-opacity="0.75"/>
    <!-- Lower Left Cyan-Tinted Inner Bevel Toe -->
    <polygon points="104,384 152,384 176,384 194,340 156,340" fill="#102a35" stroke="#06b6d4" stroke-width="1" stroke-opacity="0.45"/>

    <!-- Lower Right Leg -->
    <polygon points="316,268 350,268 408,384 360,384" fill="url(#rightFacet)" stroke="#06b6d4" stroke-width="1.4" stroke-opacity="0.8"/>
    <!-- Lower Right Amber-Tinted Inner Bevel Toe -->
    <polygon points="316,268 360,384 336,384 294,300" fill="#231c18" stroke="#f59e0b" stroke-width="1" stroke-opacity="0.4"/>

    <!-- Recessed Geometric Crossbar -->
    <polygon points="218,298 294,298 310,334 182,334" fill="#232a35" stroke="#334155" stroke-width="1"/>

    <!-- Razor-Sharp Horizontal Acoustic Pulse Line -->
    <polygon points="74,256 234,250 244,274 256,198 266,304 276,240 282,258 438,256 280,264 274,252 266,318 256,220 244,286 236,262"
      fill="#1b222c" stroke="url(#pulseRim)" stroke-width="2" stroke-linejoin="miter"/>
  </g>
</svg>


