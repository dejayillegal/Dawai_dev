<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#12161b"/>
      <stop offset="100%" stop-color="#0b0d10"/>
    </linearGradient>
    <linearGradient id="amberGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="cyanGlow" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <rect x="24" y="24" width="464" height="464" rx="80" fill="none" stroke="#262e38" stroke-width="6"/>
  <!-- DAW waveform & rhythm bars -->
  <g transform="translate(64, 96)">
    <!-- Equalizer / step tracks -->
    <rect x="20" y="160" width="24" height="120" rx="6" fill="#f59e0b"/>
    <rect x="64" y="80" width="24" height="200" rx="6" fill="#f59e0b"/>
    <rect x="108" y="40" width="24" height="240" rx="6" fill="url(#amberGlow)"/>
    <rect x="152" y="120" width="24" height="160" rx="6" fill="#f59e0b"/>
    <rect x="196" y="20" width="24" height="260" rx="6" fill="url(#cyanGlow)"/>
    <rect x="240" y="100" width="24" height="180" rx="6" fill="#06b6d4"/>
    <rect x="284" y="60" width="24" height="220" rx="6" fill="url(#cyanGlow)"/>
    <rect x="328" y="140" width="24" height="140" rx="6" fill="#06b6d4"/>

    <!-- Geometric playhead & baseline -->
    <line x1="0" y1="290" x2="384" y2="290" stroke="#262e38" stroke-width="4" stroke-linecap="round"/>
    <!-- Synthesis waveform overlay -->
    <path d="M 10 200 Q 100 80, 196 200 T 380 200" fill="none" stroke="#f59e0b" stroke-width="5" opacity="0.4"/>
    <!-- Logo wordmark -->
    <text x="192" y="360" font-family="monospace, sans-serif" font-weight="900" font-size="44" fill="#d6dde6" letter-spacing="8" text-anchor="middle">AIDAW</text>
  </g>
</svg>
